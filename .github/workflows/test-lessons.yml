name: Test private lessons

on:
  push:
    branches: [main]
    paths:
      - dashboard_app.py
      - lessons_*.py
      - tests/**
      - requirements.txt
      - .github/workflows/test-lessons.yml
  pull_request:
    paths:
      - dashboard_app.py
      - lessons_*.py
      - tests/**
      - requirements.txt
      - .github/workflows/test-lessons.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
